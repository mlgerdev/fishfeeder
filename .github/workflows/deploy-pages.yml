name: Deploy web flasher (GitHub Pages)

# Builds both firmware images, merges the ESP32-S3 full-flash image and
# publishes the ESP Web Tools flasher page + binaries to GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install toolchain
        run: pip install -U platformio "esptool==4.9.0"

      - name: Build firmware
        run: |
          pio run -e ui-node-esp32s3
          pio run -e relay-node-esp8266

      - name: Stage web flasher site
        run: |
          mkdir -p staging
          cp -r docs/. staging/

      - name: Merge ESP32-S3 full flash image
        run: |
          B=.pio/build/ui-node-esp32s3
          esptool.py --chip esp32s3 merge_bin -o staging/fishfeeder-ui-node-esp32s3.bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            0x0000  $B/bootloader.bin \
            0x8000  $B/partitions.bin \
            0xe000  $B/boot_app0.bin \
            0x10000 $B/firmware.bin

      - name: Stage ESP8266 app image
        run: |
          # NodeMCU boards ship with the SDK bootloader at 0x0 from the factory,
          # so the web flasher only needs the app image at 0x10000.
          cp .pio/build/relay-node-esp8266/firmware.bin staging/fishfeeder-relay-node-esp8266.bin

      - name: List staged files
        run: ls -la staging

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: staging

      - id: deployment
        uses: actions/deploy-pages@v4
