; FishFeeder — PlatformIO project configuration
; Two independent firmware targets share this workspace:
;   ui-node-esp32s3  : Waveshare ESP32-S3-Touch-LCD-4.3B  (LVGL 9 HMI / brain)
;   relay-node-esp8266 : ESP8266 NodeMCU V3 + 5V 1CH relay (feeder actuator)

[platformio]
default_envs = ui-node-esp32s3

[env]
monitor_speed = 115200
framework = arduino

; =====================================================================
; UI node — Waveshare ESP32-S3-Touch-LCD-4.3B (800x480 LVGL 9 HMI)
; Board file: boards/waveshare_esp32s3_lcd43b.json (16MB flash, 8MB OPI PSRAM)
; =====================================================================
[env:ui-node-esp32s3]
platform = espressif32@^6.9.0
board = waveshare_esp32s3_lcd43b
src_dir = src/ui_node
board_build.partitions = partitions_ui_16MB.csv
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    lvgl/lvgl@9.2.2
monitor_filters = esp32_exception_decoder
monitor_rts = 0
monitor_dtr = 0

; =====================================================================
; Relay node — ESP8266 NodeMCU V3 + 5V 1CH relay (feeder actuator)
; =====================================================================
[env:relay-node-esp8266]
platform = espressif8266@^4.2.1
board = nodemcuv2
src_dir = src/relay_node
monitor_rts = 0
monitor_dtr = 0
